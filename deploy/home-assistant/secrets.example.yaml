# Add this key to Home Assistant's /config/secrets.yaml, substituting the
# private contents of /etc/growhat/pump-mqtt.token for TOKEN. Never commit it.
# A fresh request ID prevents repeated clicks from being mistaken for retries.
growhat_pump_1s_payload: >-
  {"request_id":"ha-{{ now().strftime('%Y%m%d%H%M%S%f') }}","channel":1,"duty_percent":50,"duration_ms":1000,"token":"TOKEN"}
