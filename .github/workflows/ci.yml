name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install MQTT integration test dependency
        run: python3 -m venv .ci && .ci/bin/pip install paho-mqtt==2.1.0
      - name: MQTT integration tests
        run: .ci/bin/python tests/mqtt_integration.py

  cross-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.1
          target: arm-unknown-linux-gnueabihf
      - name: Install pinned ARMv6 cross-linker
        run: python3 -m venv .ci && .ci/bin/pip install ziglang==0.13.0 cargo-zigbuild==0.20.1
      - name: Add Zig to PATH
        run: echo "$GITHUB_WORKSPACE/.ci/bin" >> "$GITHUB_PATH"
      - name: Build Pi Zero binary
        run: .ci/bin/cargo-zigbuild zigbuild --locked --release --target arm-unknown-linux-gnueabihf.2.28
      - name: Check target architecture
        run: file target/arm-unknown-linux-gnueabihf/release/growhat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: growhat-armv6
          path: target/arm-unknown-linux-gnueabihf/release/growhat
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cross-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: growhat-armv6
          path: release
      - name: Create release assets
        run: |
          mv release/growhat release/growhat-armv6-linux-gnueabihf
          cd release
          sha256sum growhat-armv6-linux-gnueabihf > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" growhat-armv6-linux-gnueabihf SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
